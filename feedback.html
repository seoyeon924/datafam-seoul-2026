<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataFam Seoul 2026 · 후기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#CFE9FE;color:#001E5B;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:#fff;border:1px solid rgba(2,42,192,.15);border-radius:18px;padding:28px 26px 26px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:#3A5580;margin-top:6px;line-height:1.55}
label{display:block;font-size:12.5px;font-weight:600;color:#022AC0;margin:18px 0 6px}
input,textarea{width:100%;border:1px solid #C9D8EC;border-radius:10px;padding:11px 13px;font-size:15px;
  font-family:inherit;color:#001E5B;background:#F7FAFE}
input:focus,textarea:focus{outline:2px solid #022AC0;background:#fff}
textarea{min-height:110px;resize:vertical}
button{width:100%;margin-top:22px;background:#022AC0;color:#fff;border:0;border-radius:12px;
  padding:14px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer}
.note{font-size:11.5px;color:#5B6B84;margin-top:12px;text-align:center}
.hp{display:none}
</style>
</head>
<body>
<form class="card" name="datafam-feedback" method="POST" action="https://datafam-seoul-2026.netlify.app/api/feedback">
  
  <p class="hp"><input name="bot-field"></p>
  <h1>DataFam Seoul 2026 · 후기</h1>
  <p class="sub">후기를 남기면 Retention Matrix 확장과 Tableau MCP 활용 사례 11종 링크가 제공됩니다.</p>
  <label for="fb">오늘 세션 후기 *</label>
  <textarea id="fb" name="후기" required placeholder="세션에서 좋았던 점, 아쉬운 점"></textarea>
  <label for="em">이메일 *</label>
  <input id="em" name="이메일" type="email" required placeholder="name@company.com">
  <label for="co">회사</label>
  <input id="co" name="회사" placeholder="소속 회사">
  <label for="ro">직무</label>
  <input id="ro" name="직무" placeholder="데이터 분석가 · BI 엔지니어 등">
  <button type="submit">제출하고 자료 받기</button>
  <p class="note">수집 항목은 자료 발송 목적으로만 사용됩니다 · sy@databridge.co.kr</p>
</form>
</body>
</html>
